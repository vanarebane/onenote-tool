[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "onenote-tool"
version = "0.1.0"
description = "Parse and convert Microsoft OneNote .onepkg/.one files into neutral, semantic content blocks — including best-effort recovery of password-protected sections."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["onenote", "onepkg", "ms-onestore", "parser", "converter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    # Pinned, not >=: this package monkeypatches pyOneNote's PRIVATE internals
    # by exact attribute path (see src/onenote_tool/_patches.py). An upstream
    # version bump could silently change or remove what's being patched and
    # break parsing without raising any error. See
    # docs/knowledge/known-limitations.md before loosening this pin.
    "pyOneNote==0.0.2",
    "Pillow>=10",
    "cryptography>=44",
]

[project.optional-dependencies]
cli = ["typer>=0.12"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/vanarebane/onenote-tool"
Documentation = "https://github.com/vanarebane/onenote-tool/blob/main/Documentation.md"

[project.scripts]
onenote-tool = "onenote_tool.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/onenote_tool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
